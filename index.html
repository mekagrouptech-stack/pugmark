<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Pugmark paw favicon, generated from logo.jpeg (the wordmark is dropped —
         it is unreadable below 48px). Files live in public/ so Vite copies them
         to the build root untouched. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Inter used to be pulled in with `@import` at the top of index.css. That
         serialises four round trips before the first pixel: HTML -> app CSS ->
         Google's CSS -> the woff2 itself. Preconnecting warms the TLS handshake
         to both Google origins while the app CSS is still downloading, and the
         `media=print` swap makes the stylesheet non-blocking — text paints
         immediately in the system font and re-flows once Inter lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>HRMS - Human Resource Management System</title>

    <!-- Painted from the HTML parser, so the user sees the brand instead of a
         white screen while the JS bundle downloads and React boots. Removed by
         the first React commit (see #root:not(:empty) below), which needs no JS
         of its own and so cannot leave the splash stuck on screen. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f6fb;
        z-index: 2147483647;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app-splash .s-ring {
        width: 34px;
        height: 34px;
        border: 3px solid #dbe3f4;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: s-spin 0.7s linear infinite;
      }
      #app-splash .s-text {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.4px;
        color: #64748b;
      }
      @keyframes s-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .s-ring {
          animation-duration: 2s;
        }
      }
      #root:not(:empty) + #app-splash {
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.18s ease, visibility 0s linear 0.18s;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" aria-hidden="true">
      <div class="s-ring"></div>
      <div class="s-text">Loading HRMS…</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
